<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vòng tròn chữ trên -->
    <path id="upperArc" d="M 65,250 A 185,185 0 1,1 435,250" fill="none" />
    <!-- Vòng tròn chữ dưới -->
    <path id="lowerArc" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    
    <!-- Gradient viền vàng kim loại -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Gradient nền xanh lá trường học -->
    <radialGradient id="greenBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="70%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </radialGradient>

    <!-- Gradient ngọn lửa đuốc -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Gradient ánh hào quang mặt trời -->
    <radialGradient id="sunGrad" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- VÒNG NGOÀI CÙNG: VIỀN VÀNG RỰC RỠ -->
  <circle cx="250" cy="250" r="242" fill="url(#greenBg)" stroke="url(#goldGradient)" stroke-width="14" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-dasharray="4,3" />

  <!-- VIỀN TRONG NGĂN CÁCH VÒNG CHỮ -->
  <circle cx="250" cy="250" r="148" fill="#FFFFFF" stroke="url(#goldGradient)" stroke-width="8" />

  <!-- DÒNG CHỮ TRÊN: TRƯỜNG THPT NGUYỄN BỈNH KHIÊM -->
  <text font-family="'Inter', 'Arial', sans-serif" font-size="25.5" font-weight="900" fill="#FFFFFF" letter-spacing="2.8">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      TRƯỜNG THPT NGUYỄN BỈNH KHIÊM
    </textPath>
  </text>

  <!-- DÒNG CHỮ DƯỚI: CHÂU THÀNH - AN GIANG -->
  <text font-family="'Inter', 'Arial', sans-serif" font-size="24" font-weight="800" fill="#FDE047" letter-spacing="3.5">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
      CHÂU THÀNH — AN GIANG
    </textPath>
  </text>

  <!-- HAI NGÔI SAO VÀNG PHÂN TÁCH HAI BÊN -->
  <g fill="#FDE047" stroke="#CA8A04" stroke-width="0.8">
    <!-- Sao trái -->
    <polygon points="58,250 63,240 73,240 65,247 68,257 60,251 52,257 55,247 47,240 57,240" transform="translate(6, -2)" />
    <!-- Sao phải -->
    <polygon points="442,250 447,240 457,240 449,247 452,257 444,251 436,257 439,247 431,240 441,240" transform="translate(-6, -2)" />
  </g>

  <!-- TRUNG TÂM HUY HIỆU (Bên trong r=148) -->
  <g id="centerEmblem">
    <!-- Nền trời / hào quang mặt trời -->
    <clipPath id="centerClip">
      <circle cx="250" cy="250" r="144" />
    </clipPath>
    <g clip-path="url(#centerClip)">
      <rect x="100" y="100" width="300" height="300" fill="#F0FDF4" />
      <circle cx="250" cy="265" r="130" fill="url(#sunGrad)" />

      <!-- Các tia sáng mặt trời tri thức -->
      <g stroke="#FDE047" stroke-width="2" opacity="0.6">
        <line x1="250" y1="250" x2="250" y2="120" />
        <line x1="250" y1="250" x2="200" y2="130" />
        <line x1="250" y1="250" x2="300" y2="130" />
        <line x1="250" y1="250" x2="160" y2="155" />
        <line x1="250" y1="250" x2="340" y2="155" />
        <line x1="250" y1="250" x2="130" y2="195" />
        <line x1="250" y1="250" x2="370" y2="195" />
      </g>

      <!-- Nửa vầng thái dương đỏ hồng rực rỡ -->
      <circle cx="250" cy="255" r="50" fill="#EF4444" opacity="0.9" />

      <!-- Ngọn đuốc tri thức vươn cao -->
      <path d="M 242,240 L 258,240 L 254,295 L 246,295 Z" fill="#15803D" stroke="#047857" stroke-width="2" />
      <rect x="238" y="235" width="24" height="6" rx="2" fill="url(#goldGradient)" />

      <!-- Ngọn lửa đuốc nghệ thuật 3 lớp -->
      <path d="M 250,150 C 235,180 230,205 238,235 C 248,235 253,220 256,220 C 260,220 264,228 270,235 C 278,215 275,190 262,175 C 265,190 258,200 254,198 C 250,185 258,165 250,150 Z" fill="url(#flameGrad)" />
      <path d="M 250,175 C 242,192 240,210 245,232 C 252,232 255,224 257,224 C 260,224 262,228 266,232 C 270,218 266,200 258,188 C 259,198 255,204 253,202 C 250,194 255,182 250,175 Z" fill="#FEF08A" />

      <!-- Cây bút chì / ngòi bút bên trái -->
      <g transform="translate(-18, 10)">
        <path d="M 235,270 L 235,320 L 225,320 L 225,270 L 230,260 Z" fill="#FFFFFF" stroke="#15803D" stroke-width="2" />
        <path d="M 228,272 L 232,272 L 232,318 L 228,318 Z" fill="#EF4444" />
      </g>

      <!-- Ngòi bút máy tri thức bên phải -->
      <g transform="translate(18, 5)">
        <path d="M 265,270 C 265,255 275,248 275,248 C 275,248 285,255 285,270 L 285,320 L 265,320 Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" />
        <circle cx="275" cy="275" r="3.5" fill="#1E3A8A" />
        <line x1="275" y1="278" x2="275" y2="300" stroke="#1E3A8A" stroke-width="2" />
      </g>

      <!-- CUỐN SÁCH MỞ RỘNG -->
      <g id="openBook" transform="translate(0, 15)">
        <path d="M 250,298 C 215,290 175,295 155,308 L 155,348 C 178,335 218,330 250,338 C 282,330 322,335 345,348 L 345,308 C 325,295 285,290 250,298 Z" fill="#166534" opacity="0.3" />
        <path d="M 250,294 C 215,286 175,291 152,304 L 152,342 C 175,329 215,324 250,332 C 285,324 325,329 348,342 L 348,304 C 325,291 285,286 250,294 Z" fill="url(#goldGradient)" stroke="#854D0E" stroke-width="2" />
        <path d="M 250,290 C 217,282 180,287 156,299 L 156,336 C 180,324 217,319 250,327 C 283,319 320,324 344,336 L 344,299 C 320,287 283,282 250,290 Z" fill="#FFFFFF" stroke="#15803D" stroke-width="1.8" />
        <line x1="250" y1="290" x2="250" y2="330" stroke="#15803D" stroke-width="2.5" />
        <line x1="175" y1="305" x2="235" y2="300" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
        <line x1="175" y1="315" x2="235" y2="310" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
        <line x1="265" y1="300" x2="325" y2="305" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
        <line x1="265" y1="310" x2="325" y2="315" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- DẢI BĂNG RÔN NĂM THÀNH LẬP 1983 -->
      <g id="yearBanner" transform="translate(0, 18)">
        <path d="M 185,360 L 175,375 L 195,372 Z" fill="#B45309" />
        <path d="M 315,360 L 325,375 L 305,372 Z" fill="#B45309" />
        <path d="M 185,350 Q 250,364 315,350 L 318,368 Q 250,384 182,368 Z" fill="#DC2626" stroke="#FDE047" stroke-width="2" />
        <text x="250" y="365" font-family="'Inter', 'Arial', sans-serif" font-size="14.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">
          1983
        </text>
      </g>
    </g>
  </g>
</svg>
